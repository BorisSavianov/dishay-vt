[project]
name = "fmi-open-data"
version = "0.1.0"
description = "Static data pipeline for the FMI Open Data Hackathon starter"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
ml = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "scikit-learn>=1.9.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ml/tests"]
